<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" />
  
  <!-- Outer Subtle Ring -->
  <circle cx="60" cy="60" r="38" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="4 3" />
  
  <!-- Lens Glass Outer Ring -->
  <circle cx="58" cy="58" r="30" fill="none" stroke="url(#lensGrad)" stroke-width="7" />
  
  <!-- Inner Lens Glass Highlight -->
  <ellipse cx="50" cy="50" rx="14" ry="8" transform="rotate(-30 50 50)" fill="url(#glowGrad)" />
  
  <!-- Iris / Compass Crosshair -->
  <circle cx="58" cy="58" r="7" fill="#F59E0B" />
  <circle cx="58" cy="58" r="3.5" fill="#FFFBEB" />
  
  <!-- Monocle / Lens Handle -->
  <path d="M 80 80 L 102 102" stroke="url(#lensGrad)" stroke-width="8" stroke-linecap="round" />
  
  <!-- Cognitive Spark (UNESCO MIL Enlightenment) -->
  <path d="M 94 28 L 97 36 L 105 39 L 97 42 L 94 50 L 91 42 L 83 39 L 91 36 Z" fill="#FBBF24" />
</svg>
